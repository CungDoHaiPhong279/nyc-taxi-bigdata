services:
  postgres:
    image: postgres:16
    container_name: nyc-taxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
      POSTGRES_USER: ${POSTGRES_USER:-nyc_taxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyc_taxi} -d ${POSTGRES_DB:-nyc_taxi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.5.1
    container_name: nyc-taxi-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: nyc-taxi-dashboard:p4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
      POSTGRES_USER: ${POSTGRES_USER:-nyc_taxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["jobs"]
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: nyc-taxi-worker:p2
    restart: "no"
    command: ["python", "scripts/check_worker_services.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
      POSTGRES_USER: ${POSTGRES_USER:-nyc_taxi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  postgres-data:
  mlflow-data:

